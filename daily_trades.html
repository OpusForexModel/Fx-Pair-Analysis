<script>
window.addEventListener('load', function() {
    setTimeout(function() {
        var chartDiv = document.getElementById('chart-view');
        var chartContainer = chartDiv.parentElement;
        
        if(chartDiv && window.Plotly) {
            // Set the chart to fit the container width initially
            var containerWidth = chartContainer.clientWidth;
            
            // Update the layout to fit the container
            var update = {
                width: containerWidth - 20, // Subtract padding/margin
                autosize: false,
                margin: { l: 50, r: 20, t: 50, b: 50 } // Adjust margins to prevent empty space
            };
            
            Plotly.relayout(chartDiv, update);
            
            // Add event listener for container resize
            window.addEventListener('resize', function() {
                var newWidth = chartContainer.clientWidth;
                Plotly.relayout(chartDiv, {
                    width: newWidth - 20,
                    autosize: false
                });
            });
        }
    }, 500); // Give chart time to initialize
});
</script>
